<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<!-- Attack: a short sword, point up-left (the hotspot is the point). -->
<defs>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="0.45" stop-color="#b9c0c6"/><stop offset="1" stop-color="#6e767e"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c08850"/><stop offset="0.5" stop-color="#8a5a2e"/><stop offset="1" stop-color="#5e3a1a"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="0.5" stop-color="#d4a640"/><stop offset="1" stop-color="#8a6018"/></linearGradient>
<linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="0.6" stop-color="#eadcb8"/><stop offset="1" stop-color="#c0a878"/></linearGradient>
</defs>
<g transform="translate(3,3) rotate(-45)">
<path d="M0,0 L3,4 L3,24 L-3,24 L-3,4 Z" fill="url(#steel)" stroke="#1c120a" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M0,2 L0,23" stroke="#5e666e" stroke-width="0.9"/>
<path d="M-1.6,5 L-1.6,22" stroke="#ffffff" stroke-width="0.9" opacity="0.85"/>
<rect x="-7" y="24" width="14" height="3" rx="1.4" fill="url(#gold)" stroke="#1c120a" stroke-width="1.3"/>
<rect x="-1.6" y="27" width="3.2" height="7" fill="#8a2a22" stroke="#1c120a" stroke-width="1.2"/>
<circle cx="0" cy="35.5" r="2.2" fill="url(#gold)" stroke="#1c120a" stroke-width="1.2"/>
</g>
</svg>
